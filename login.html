<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - MindWell</title>
    <link rel="stylesheet" href="login.css" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="auth-card">
      <div class="logo">M</div>
      <h1 style="margin-bottom: 0.5rem">Bem-vindo</h1>
      <p style="color: #71717a; margin-bottom: 2rem">Sua jornada de equilíbrio começa aqui.</p>

      <form id="login-form">
        <input type="email" id="login-email" placeholder="seu@email.com" required />
        <input type="password" id="login-password" placeholder="Sua senha" required />
        <button type="submit" class="btn">Entrar na Plataforma</button>
      </form>

      <p style="margin-top: 1.5rem; font-size: 0.9rem">Novo por aqui? <a href="cadastro.html">Criar conta</a></p>
    </div>
    <script src="login.js"></script>
  </body>
</html>
